# yaml-language-server: $schema=https://raw.githubusercontent.com/sgnl-actions/schemas/main/metadata.schema.json
name: snowflake-grant-sync
description: Sync SGNL access decisions to Snowflake by writing or deleting rows in the sgnl_access_grants table via the Snowflake SQL API

inputs:
  snowflake_user:
    type: text
    description: Snowflake username (plain login name, e.g. "alice"). Will be uppercased automatically to match current_user() behavior.
    required: true
    validation:
      min: 1
      max: 100

  action:
    type: text
    description: Operation to perform — "grant" upserts a row, "revoke" deletes a specific resource row, "full_revoke" deletes all rows for the user
    required: true
    validation:
      min: 1
      max: 20

  resource_type:
    type: text
    description: The resource type (e.g. "Engineering", "Finance"). Required for grant and revoke; ignored for full_revoke.
    required: false
    validation:
      max: 100

  address:
    type: text
    description: Snowflake SQL API base URL (e.g. https://<account>.snowflakecomputing.com). Falls back to ADDRESS environment variable.
    required: false
    validation:
      min: 1
      max: 500

  warehouse:
    type: text
    description: Snowflake warehouse to use for SQL execution (e.g. COMPUTE_WH).
    required: false
    validation:
      min: 1
      max: 100

outputs:
  status:
    type: text
    description: Result of the operation ("ok")

  action:
    type: text
    description: The action that was performed

  snowflake_user:
    type: text
    description: The Snowflake username (uppercased) that was modified

  resource_type:
    type: text
    description: The resource type that was granted or revoked

  completed_at:
    type: datetime
    description: When the operation completed (ISO 8601)

secrets:
  BEARER_AUTH_TOKEN:
    type: text
    description: Snowflake API Bearer token (for Bearer authentication)
    required: false

  OAUTH2_CLIENT_CREDENTIALS_CLIENT_SECRET:
    type: text
    description: Client secret for OAuth2 Client Credentials flow
    required: false

  OAUTH2_AUTHORIZATION_CODE_ACCESS_TOKEN:
    type: text
    description: Access token for OAuth2 Authorization Code flow
    required: false

environment:
  ADDRESS:
    type: text
    description: Snowflake SQL API base URL (e.g. https://<account>.snowflakecomputing.com)

  OAUTH2_CLIENT_CREDENTIALS_CLIENT_ID:
    type: text
    description: Client ID for OAuth2 Client Credentials flow
    required: false

  OAUTH2_CLIENT_CREDENTIALS_TOKEN_URL:
    type: text
    description: Token endpoint URL for OAuth2 Client Credentials flow
    required: false

  OAUTH2_CLIENT_CREDENTIALS_SCOPE:
    type: text
    description: OAuth2 scopes for Client Credentials flow
    required: false

  OAUTH2_CLIENT_CREDENTIALS_AUDIENCE:
    type: text
    description: OAuth2 audience for Client Credentials flow
    required: false

  OAUTH2_CLIENT_CREDENTIALS_AUTH_STYLE:
    type: text
    description: OAuth2 auth style for Client Credentials flow
    required: false

optional_one_of:
  - ["secrets.BEARER_AUTH_TOKEN"]
  - [
      "secrets.OAUTH2_CLIENT_CREDENTIALS_CLIENT_SECRET",
      "environment.OAUTH2_CLIENT_CREDENTIALS_CLIENT_ID",
      "environment.OAUTH2_CLIENT_CREDENTIALS_TOKEN_URL",
    ]
  - ["secrets.OAUTH2_AUTHORIZATION_CODE_ACCESS_TOKEN"]

runtime:
  type: nodejs-22
  timeout: 30s
  memory: 128Mi
